<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso denegado · Saraitel</title>
<!-- Página pública: la muestra SeguridadConfiguracion cuando el correo no es de un empleado activo. -->
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #5f6b7d; --border: #dde1e7; --accent: #1f6feb; --accent-text: #fff; --err: #c62828; --err-bg: #fdecec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #9aa4b2; --border: #2e3440; --accent: #4c8dff; --accent-text: #0b0e13; --err: #ff8a80; --err-bg: #3a1717; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 480px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .etiqueta { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; margin-bottom: 12px; background: var(--err-bg); color: var(--err); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  a.boton { display: inline-block; margin-top: 8px; padding: 9px 16px; border-radius: 6px; background: var(--accent); color: var(--accent-text); font-weight: 600; text-decoration: none; }
  a.boton:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <span class="etiqueta">Acceso denegado</span>
  <h1>No puede ingresar a Saraitel</h1>
  <p>El correo con el que se autenticó no pertenece a un empleado activo. Solo los empleados activos pueden ingresar a la plataforma.</p>
  <p>Intente con otra cuenta o contacte al administrador de la aplicación.</p>
  <a class="boton" href="/oauth2/authorization/google">Intentar con otra cuenta</a>
</main>
</body>
</html>
